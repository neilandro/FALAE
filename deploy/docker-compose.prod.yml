services:
  db:
    image: mysql:8.4

    restart: unless-stopped

    environment:
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      TZ: ${TZ:-America/Sao_Paulo}

    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=-03:00
      - --max-connections=100
      - --innodb-buffer-pool-size=768M

    volumes:
      - mysql_data:/var/lib/mysql

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD --silent"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s

    networks:
      - falae_network

  web:
    build:
      context: ..
      dockerfile: Dockerfile

    restart: unless-stopped

    env_file:
      - .env

    environment:
      APP_ENV: production
      ENVIRONMENT: production

      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}

      UPLOAD_FOLDER: /app/uploads
      LOG_FOLDER: /app/logs

      SESSION_COOKIE_SECURE: "true"
      WTF_CSRF_ENABLED: "true"
      WTF_CSRF_SSL_STRICT: "true"

      TZ: ${TZ:-America/Sao_Paulo}

    depends_on:
      db:
        condition: service_healthy

    expose:
      - "8000"

    volumes:
      - uploads_data:/app/uploads
      - logs_data:/app/logs

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=4)"
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

    networks:
      - falae_network

volumes:
  mysql_data:
    name: falae_mysql_data

  uploads_data:
    name: falae_uploads_data

  logs_data:
    name: falae_logs_data

networks:
  falae_network:
    name: falae_network
    driver: bridge