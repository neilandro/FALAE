{% extends "layouts/admin_base.html" %}

{% block title %}Nova Unidade | FALAE{% endblock %}

{% block content %}

<div class="page-header">
    <h1>🏢 Nova Unidade</h1>
    <p>Cadastre uma nova unidade da empresa.</p>
</div>

<div class="card tratamento-card">

    <div class="tratamento-header">
        <div>
            <h2>Cadastro de Unidade</h2>
            <p>As unidades serão utilizadas nas denúncias, indicadores e workflows.</p>
        </div>
    </div>

    <form method="POST" class="tratamento-form">

        <div class="tratamento-grid">

            <div class="tratamento-field tratamento-field-full">
                <label>Nome da Unidade *</label>

                <input
                    type="text"
                    name="nome"
                    required
                    placeholder="Ex.: Matriz, Filial Guarulhos, Unidade Campinas">
            </div>

        </div>

        <div class="tratamento-actions">

            <button type="submit">
                💾 Salvar Unidade
            </button>

            <a href="/empresa/unidades" class="btn-secundario">
                ← Voltar
            </a>

        </div>

    </form>

</div>

{% endblock %}
