{% extends "layouts/admin_base.html" %}

{% block title %}Nova Empresa Cliente | FALAE{% endblock %}

{% block content %}

<div class="page-header">
    <h1>🏢 Nova Empresa Cliente</h1>
    <p>Cadastre uma empresa atendida pela assessoria.</p>
</div>

<div class="card">
    <div class="triagem-header">
        <div>
            <h2>Cadastro de Empresa</h2>
            <p>Informe os dados principais da empresa cliente.</p>
        </div>
    </div>

    <form method="POST" class="form-card">
        <div class="form-grid">
            <div class="form-group">
                <label>Nome *</label>
                <input type="text" name="nome" required placeholder="Ex.: Hospital Santa Maria">
            </div>

            <div class="form-group">
                <label>CNPJ</label>
                <input type="text" name="cnpj" placeholder="00.000.000/0000-00">
            </div>
           
            <div class="form-group">
                <label>Plano</label>
                <select name="plano">
                    <option value="BASICO">Básico</option>
                    <option value="PROFISSIONAL">Profissional</option>
                    <option value="ENTERPRISE">Enterprise</option>
                </select>
            </div>
        </div>

        <div class="form-actions">
            <button type="submit">💾 Salvar Empresa</button>
            <a href="/assessoria/empresas" class="btn-secundario">← Voltar</a>
        </div>
    </form>
</div>

{% endblock %}
