{% extends "layouts/admin_base.html" %}

{% block content %}
<div class="card">
    <div class="page-header">
        <h1>👤 Novo Usuário</h1>
        <p>Cadastre um usuário administrativo na plataforma.</p>
    </div>

    <form method="POST" class="form-card">

        <div class="form-grid">
            <label>Empresa *</label>
            <select name="empresa_id" required>
                <option value="">Selecione a empresa</option>
                {% for empresa in empresas %}
                    <option
                        value="{{ empresa.id }}"
                        {% if empresa_id_preselecionada and empresa_id_preselecionada|int == empresa.id %}
                            selected
                        {% endif %}
                    >
                        {{ empresa.nome }}
                    </option>
                {% endfor %}
            </select>

            <label>Nome *</label>
            <input type="text" name="nome" required>

            <label>E-mail *</label>
            <input type="email" name="email" required>

            <label>Senha inicial *</label>
            <input type="password" name="senha" required>

            <label>Perfil *</label>
            <select name="perfil" required>
                <option value="ADMIN_EMPRESA">Administrador da Empresa</option>
                <option value="GESTOR">Gestor</option>
                <option value="SUPER_ADMIN">Super Admin</option>
                <option value="ADMIN_ASSESSORIA">Administrador da Assessoria</option>
                <option value="INVESTIGADOR">Investigador da Denúncia</option>

            </select>

            <div class="form-actions">

            <button type="submit" class="btn">
                💾 Salvar Usuário
            </button>

            <a href="/admin/usuarios" class="btn-secundario">
                ← Voltar
            </a>

        </div>
    </form>
</div>
{% endblock %}
