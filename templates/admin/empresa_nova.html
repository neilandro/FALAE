{% extends "layouts/admin_base.html" %}

{% block title %}Nova Empresa | FALAE{% endblock %}

{% block content %}

<div class="page-header">
    <h1>🏢 Nova Empresa</h1>
    <p>Cadastre uma empresa na plataforma.</p>
</div>

<div class="card">
    <form method="POST" action="/admin/empresas/nova" class="form-card">

        <h2>Dados principais</h2>

        <div class="form-grid">
            <div class="form-group">
                <label>Nome *</label>
                <input type="text" name="nome" required placeholder="Ex.: Hospital Santa Maria">
            </div>

            <div class="form-group">
                <label>CNPJ</label>
                <input type="text" name="cnpj" placeholder="00.000.000/0000-00">
            </div>

            <div class="form-group">
                <label>Plano</label>
                <select name="plano">
                    <option value="BASICO">Básico</option>
                    <option value="PROFISSIONAL">Profissional</option>
                    <option value="ENTERPRISE">Enterprise</option>
                </select>
            </div>

            <div class="form-group">
                <label>Assessoria</label>
                <select name="assessoria_id">
                    <option value="">Nenhuma</option>

                    {% for assessoria in assessorias %}
                        <option value="{{ assessoria.id }}">
                            {{ assessoria.nome }}
                        </option>
                    {% endfor %}
                </select>
            </div>
        </div>

        <h2>Endereço</h2>

        <div class="form-grid">
            <div class="form-group">
                <label>CEP</label>
                <input type="text" name="cep" placeholder="00000-000">
            </div>

            <div class="form-group">
                <label>Endereço</label>
                <input type="text" name="endereco" placeholder="Rua, Avenida, Estrada...">
            </div>

            <div class="form-group">
                <label>Número</label>
                <input type="text" name="numero" placeholder="123">
            </div>

            <div class="form-group">
                <label>Complemento</label>
                <input type="text" name="complemento" placeholder="Sala, bloco, andar...">
            </div>

            <div class="form-group">
                <label>Bairro</label>
                <input type="text" name="bairro" placeholder="Centro">
            </div>

            <div class="form-group">
                <label>Cidade</label>
                <input type="text" name="cidade" placeholder="Guarulhos">
            </div>

            <div class="form-group">
                <label>Estado</label>
                <input type="text" name="estado" maxlength="2" placeholder="SP">
            </div>
        </div>
            
        <h2>Contato Principal</h2>
             

            <div class="form-grid">
                <div class="form-group">
                    <label>Nome do contato</label>
                    <input type="text" name="contato_nome" placeholder="Ex.: Carlos Silva">
                </div>

                <div class="form-group">
                    <label>Cargo</label>
                    <input type="text" name="contato_cargo" placeholder="Ex.: Gerente de SST">
                </div>

                <div class="form-group">
                    <label>E-mail</label>
                    <input type="email" name="contato_email" placeholder="contato@empresa.com.br">
                </div>

                <div class="form-group">
                    <label>Telefone</label>
                    <input type="text" name="contato_telefone" placeholder="(00) 0000-0000">
                </div>

                <div class="form-group">
                    <label>WhatsApp</label>
                    <input type="text" name="contato_whatsapp" placeholder="(00) 00000-0000">
                </div>
            </div>
                        
        
        <div class="form-actions">
            <button type="submit" class="btn">
                💾 Salvar Empresa
            </button>

            <a href="/admin/empresas" class="btn-secundario">
                ← Voltar
            </a>
        </div>

    </form>
</div>

{% endblock %}
