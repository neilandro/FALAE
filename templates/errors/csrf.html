{% extends "layouts/base.html" %}

{% block content %}

<style>
    .csrf-page {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        padding: 24px;
        background: #f8fafc;
    }

    .csrf-card {
        width: 100%;
        max-width: 520px;
        padding: 34px;
        border: 1px solid #dbe3ec;
        border-radius: 18px;
        background: #ffffff;
        box-shadow: 0 20px 50px rgba(15, 23, 42, 0.10);
        text-align: center;
    }

    .csrf-icon {
        margin-bottom: 16px;
        font-size: 42px;
    }

    .csrf-card h1 {
        margin: 0 0 12px;
        color: #0f172a;
        font-size: 25px;
    }

    .csrf-card p {
        margin: 0 0 24px;
        color: #64748b;
        font-size: 14px;
        line-height: 1.65;
    }

    .csrf-action {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 45px;
        padding: 10px 18px;
        border: 0;
        border-radius: 10px;
        color: #ffffff;
        font-size: 14px;
        font-weight: 800;
        text-decoration: none;
        background: #1f4e78;
    }
</style>

<div class="csrf-page">
    <section class="csrf-card">
        <div class="csrf-icon">🛡️</div>

        <h1>Sessão de segurança expirada</h1>

        <p>
            A solicitação não pôde ser concluída porque o token de
            segurança expirou ou não foi encontrado. Volte para a
            tela de acesso e tente novamente.
        </p>

        <a
            href="{{ url_for('auth.login') }}"
            class="csrf-action"
        >
            Voltar para o acesso
        </a>
    </section>
</div>

{% endblock %}
