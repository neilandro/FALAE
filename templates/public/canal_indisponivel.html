<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Canal indisponível | FALAE</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 24px;
            color: #1f2937;
            font-family: Arial, sans-serif;
            background: #f3f4f6;
        }

        .card {
            width: 100%;
            max-width: 520px;
            padding: 32px;
            border-radius: 16px;
            text-align: center;
            background: #ffffff;
            box-shadow: 0 14px 40px rgba(15, 23, 42, 0.1);
        }

        .icone {
            margin-bottom: 16px;
            font-size: 48px;
        }

        h1 {
            margin: 0 0 12px;
        }

        p {
            margin: 0;
            color: #6b7280;
            line-height: 1.6;
        }
    </style>
</head>

<body>

    <main class="card">
        <div class="icone">🛡️</div>

        <h1>Canal indisponível</h1>

        <p>
            {{ mensagem }}
        </p>
    </main>

</body>
</html>
