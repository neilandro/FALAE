services:
  web:
    build:
      context: .
      dockerfile: Dockerfile

    env_file:
      - .env.local

    ports:
      - "127.0.0.1:8000:8000"

    extra_hosts:
      - "host.docker.internal:host-gateway"

    volumes:
      - uploads_data:/app/uploads
      - logs_data:/app/logs

    restart: unless-stopped

volumes:
  uploads_data:
  logs_data: